# step: installing_gitlab
# chart: gitlab 8.7.2
certmanager:
    install: false
certmanager-issuer:
    enabled: false
gitlab:
    kas:
        ingress:
            enabled: false
    sidekiq:
        livenessProbe:
            failureThreshold: 6
            initialDelaySeconds: 240
            periodSeconds: 20
            timeoutSeconds: 10
        readinessProbe:
            failureThreshold: 18
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
    toolbox:
        backups:
            objectStorage:
                config:
                    key: config
                    secret: nullus-object-storage
    webservice:
        ingress:
            enabled: false
        livenessProbe:
            failureThreshold: 6
            initialDelaySeconds: 180
            periodSeconds: 20
            timeoutSeconds: 10
        readinessProbe:
            failureThreshold: 18
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
gitlab-runner:
    install: false
global:
    appConfig:
        object_store:
            connection:
                key: connection
                secret: nullus-object-storage
            enabled: true
    edition: ce
    hosts:
        domain: nullus.internal
        https: false
    ingress:
        configureCertmanager: false
        enabled: false
    minio:
        enabled: false
    psql:
        database: gitlabhq_production
        host: nullus-postgresql.nullus.svc.cluster.local
        password:
            key: password
            secret: nullus-postgresql-credentials
            useSecret: true
        port: 5432
        username: gitlab
nginx-ingress:
    enabled: false
postgresql:
    install: false
prometheus:
    install: false
redis:
    image:
        repository: bitnamilegacy/redis
        tag: 7.4.2-debian-12-r0
    master:
        livenessProbe:
            enabled: true
            failureThreshold: 8
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
        readinessProbe:
            enabled: true
            failureThreshold: 12
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
        resources:
            limits:
                cpu: 500m
                memory: 1Gi
            requests:
                cpu: 250m
                memory: 512Mi
    metrics:
        image:
            repository: bitnamilegacy/redis-exporter
            tag: 1.76.0-debian-12-r0
registry:
    authEndpoint: https://gitlab.nullus.internal
    ingress:
        enabled: false
    storage:
        key: config
        secret: nullus-registry-storage
