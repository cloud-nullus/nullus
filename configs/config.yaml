server:
  port: 8090
  mode: development

database:
  host: localhost
  port: 5433
  name: nullus
  user: nullus
  password: nullus_dev
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 5m
  conn_max_idle_time: 1m

auth:
  mode: session  # session | oidc
  session:
    secret: dev-secret-change-in-production
    max_age: 86400
  oidc:
    provider: keycloak
    issuer_url: http://localhost:8180/realms/nullus
    audience: nullus-app

# 스택이 설치하는 OSS(GitLab/Grafana/ArgoCD/Harbor/MinIO)의 OIDC 클라이언트를
# 자동 등록할 플랫폼 Keycloak 의 관리자 자격이다 (설치 파이프라인의 provisioning_sso).
#
# admin_url 이 비면 프로비저닝을 통째로 건너뛴다 — BYO IdP 나 SSO 미사용 구성이다.
# 기본값을 비워 두는 것은 의도적이다: 값이 박혀 있으면 Keycloak 을 안 띄운 로컬
# 실행(runbook --auth=none)에서도 프로비저닝을 시도해 설치가 깨진다.
# 로컬에서 켜려면 runbook 이 --auth=keycloak 일 때 NULLUS_KEYCLOAK_* 를 넣어 준다.
#
# public_url 은 브라우저가 접근하는 Keycloak 주소다. 설치되는 OSS 는 이 주소로
# 브라우저를 보내므로 포털이 로그인한 곳과 **오리진이 같아야** SSO 세션이 이어진다.
# 비워 두면 auth.oidc.issuer_url 을 그대로 물려받는다 — 대개 그게 맞다.
# admin_url 이 클러스터 내부 주소인 구성에서만 따로 채운다.
keycloak:
  admin_url: ""
  public_url: ""
  realm: nullus
  admin_user: admin
  admin_password: ""

helm:
  timeout: 600s
  namespace_prefix: nullus-

prometheus:
  url: ""

log:
  level: debug
  format: text  # text | json

# 백업/복구 (nullus-plan#75)
# 설계: docs/11_기능설계/Nullus_백업복구_설계.md
#
# 목적지는 **대상 클러스터 밖**의 S3 호환 오브젝트 스토리지다. 클러스터·노드·
# 스토리지가 통째로 사라져도 백업본은 남아야 하기 때문이다(§4.2).
#
# 자격증명이 스택 OpenBao 가 아니라 여기서 오는 것이 핵심이다 — 금고에서
# 조달하면 스택이 죽을 때 백업본이 멀쩡해도 가져올 수 없다(§4.2.1).
backup:
  enabled: false
  # 산출물 암호화 키. 정확히 32바이트여야 하고, ENCRYPTION_KEY 및 DB
  # 비밀번호와 **다른 값**이어야 한다 — 같으면 키 하나를 잃고 둘 다 잃는다(§5.2).
  seal_key: ""
  seal_key_id: platform-key-v1

  destination:
    endpoint: ""      # 예: minio.internal:9000 (클러스터 밖)
    bucket: nullus-backup
    access_key: ""
    secret_key: ""
    region: us-east-1
    use_ssl: true
    prefix: ""

  # Keycloak 전용 DB. 배포 경로에 따라 위치가 다르다 —
  # 차트는 서브차트로, 에어갭 스크립트는 nullus-auth 네임스페이스의
  # 독립 릴리스로 띄운다(§1.2). 그래서 하드코딩하지 않고 설정으로 받는다.
  keycloak_database:
    host: ""
    port: 5432
    name: bitnami_keycloak
    user: bn_keycloak
    password: ""

  schedule:
    enabled: false
    interval: 24h     # RPO 24시간 (§2)
    org_id: ""
    stack_id: ""
    namespace: ""
    mode: full        # full | platform_only | stack_only

  # 일7/주4/월3 (§4.5). max_total_bytes 가 0 이면 총량 상한을 적용하지 않는다.
  retention:
    daily: 7
    weekly: 4
    monthly: 3
    max_total_bytes: 0
