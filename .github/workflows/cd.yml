name: CD

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - phase1
  workflow_dispatch:

# 기본은 최소 권한. 필요한 잡에서만 개별로 올린다.
permissions:
  contents: read

jobs:
  build-and-push-api:
    permissions:
      contents: read
      packages: write
    name: Build & Push API Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/nullus-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=,format=short

      - name: Build and push API image (linux/amd64,linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-web:
    permissions:
      contents: read
      packages: write
    name: Build & Push Web Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/nullus-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=,format=short

      - name: Build and push Web image (linux/amd64,linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          # OIDC SSO 빌드 설정을 정적 번들에 주입 (repo Variables 로 오버라이드 가능)
          build-args: |
            VITE_AUTH_MODE=${{ vars.VITE_AUTH_MODE || 'oidc' }}
            VITE_OIDC_PROVIDER=${{ vars.VITE_OIDC_PROVIDER || 'keycloak' }}
            VITE_OIDC_AUTHORITY=${{ vars.VITE_OIDC_AUTHORITY || 'http://keycloak.nullus.internal/realms/nullus' }}
            VITE_OIDC_CLIENT_ID=${{ vars.VITE_OIDC_CLIENT_ID || 'nullus-app' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 태그 push 시에만 Helm 차트를 ghcr OCI 레지스트리에 게시한다 (릴리즈 정책 §7.2).
  # 이미지와 동일한 레지스트리·인증을 쓰므로 별도 gh-pages 운영이 필요 없다.
  publish-chart:
    permissions:
      contents: read
      packages: write
    name: Package & Push Helm Chart
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to the Container registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" \
            | helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin

      - name: Package & push chart
        run: |
          # 차트 version/appVersion 은 태그에서 주입한다 — Chart.yaml 커밋값은 clone 설치용 기본값
          VERSION="${GITHUB_REF_NAME#v}"
          helm dependency update deploy/helm/nullus
          helm package deploy/helm/nullus --version "$VERSION" --app-version "$VERSION"
          helm push "nullus-${VERSION}.tgz" oci://ghcr.io/cloud-nullus/charts

  # 태그 push 시 빌드 및 차트 게시가 성공하면 GitHub Release를 자동으로 생성한다.
  # CHANGELOG.md에서 해당 버전의 릴리즈 노트를 추출하며, GA 전 버전(0.x.x 또는 -alpha/-beta/-rc)은 prerelease로 지정한다.
  create-release:
    permissions:
      contents: write   # 릴리즈 생성에만 필요하다
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-push-api, build-and-push-web, publish-chart]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract release notes and prerelease flag
        id: notes
        run: |
          set -euo pipefail
          # 태그에서 v 접두사를 뗀 값이 CHANGELOG 의 섹션 제목이자 이미지 태그다.
          VERSION="${GITHUB_REF_NAME#v}"

          # CHANGELOG 의 해당 버전 섹션만 잘라 릴리즈 본문으로 쓴다. 섹션이 없으면
          # GitHub 자동 생성 노트로 폴백한다 — 빈 본문으로 릴리즈가 나가는 것보다 낫다.
          python3 - "$VERSION" <<'PY'
          import os, re, sys

          version = sys.argv[1]
          found = False
          try:
              content = open('CHANGELOG.md', encoding='utf-8').read()
              m = re.search(
                  r'(?m)^##\s*\[v?' + re.escape(version) + r'\][^\n]*\n(.*?)(?=\n^##\s|\Z)',
                  content, re.DOTALL)
              if m and m.group(1).strip():
                  open('release_notes.md', 'w', encoding='utf-8').write(m.group(1).strip() + '\n')
                  found = True
          except OSError:
              pass

          # GA(1.0.0) 이전은 전부 프리릴리즈다 (릴리즈 정책 §7).
          pre = bool(re.search(r'-(alpha|beta|rc)', version)) or version.split('.')[0] == '0'

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'has_notes={"true" if found else "false"}\n')
              out.write(f'prerelease={"true" if pre else "false"}\n')
          PY

      - name: Create GitHub Release (with CHANGELOG notes)
        if: steps.notes.outputs.has_notes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          prerelease: ${{ steps.notes.outputs.prerelease == 'true' }}

      # CHANGELOG 에 해당 섹션이 없을 때만. body_path 와 generate_release_notes 를
      # 한 스텝에서 조건부로 섞으면 빈 경로가 넘어가 실패하므로 스텝을 나눈다.
      - name: Create GitHub Release (generated notes)
        if: steps.notes.outputs.has_notes != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.notes.outputs.prerelease == 'true' }}

  # Zadara Cloud 배포. 외부에서 열린 포트가 22/tcp 뿐이라 bastion 을 경유한다.
  # environment 를 지정해 실배포 직전에 승인 게이트를 걸 수 있게 한다.
  deploy-zadara:
    permissions:
      contents: read
    name: Deploy to Zadara Cloud
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build-and-push-api, build-and-push-web]
    environment: zadara
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          ZADARA_SSH_KEY: ${{ secrets.ZADARA_SSH_KEY }}
          ZADARA_HOST: ${{ secrets.ZADARA_HOST }}
          ZADARA_USER: ${{ secrets.ZADARA_USER }}
          NULLUS_DB_PASSWORD: ${{ secrets.NULLUS_DB_PASSWORD }}
          NULLUS_ENCRYPTION_KEY: ${{ secrets.NULLUS_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          # 시크릿이 없으면 조용히 건너뛰지 않고 무엇이 빠졌는지 알리고 실패한다.
          missing=""
          for name in ZADARA_SSH_KEY ZADARA_HOST ZADARA_USER NULLUS_DB_PASSWORD NULLUS_ENCRYPTION_KEY; do
            [ -z "${!name:-}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "필수 secret 이 없습니다:$missing" >&2
            exit 1
          fi

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ZADARA_SSH_KEY }}

      - name: Pin bastion host key
        env:
          ZADARA_HOST: ${{ secrets.ZADARA_HOST }}
          ZADARA_SSH_HOST_KEY: ${{ secrets.ZADARA_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # ssh-keyscan 은 그때 응답한 키를 그대로 믿는다(TOFU). 중간자가 있으면
          # 그 키를 신뢰하게 되고, 배포용 개인키가 그대로 넘어간다.
          # 그래서 호스트 키를 secret 으로 고정한다.
          if [ -z "${ZADARA_SSH_HOST_KEY:-}" ]; then
            echo "ZADARA_SSH_HOST_KEY 가 없습니다. 아래 값을 secret 으로 등록하십시오:" >&2
            ssh-keyscan -t ed25519 "$ZADARA_HOST" 2>/dev/null | grep -v '^#' >&2
            exit 1
          fi
          printf '%s\n' "$ZADARA_SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy via bastion
        env:
          ZADARA_HOST: ${{ secrets.ZADARA_HOST }}
          ZADARA_USER: ${{ secrets.ZADARA_USER }}
          NULLUS_DB_PASSWORD: ${{ secrets.NULLUS_DB_PASSWORD }}
          NULLUS_ENCRYPTION_KEY: ${{ secrets.NULLUS_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          # 원격 셸에 넘길 값은 전부 base64 로 감싼다.
          #
          # 왜: 값을 heredoc 안에 그대로 전개하면 따옴표를 포함한 값 하나로 원격
          # 셸에서 임의 명령을 실행할 수 있다. 태그명(GITHUB_REF_NAME)도 push 권한만
          # 있으면 임의로 만들 수 있는 외부 입력이라 같은 위험이 있다.
          # base64 출력은 [A-Za-z0-9+/=] 뿐이라 따옴표를 벗어날 수 없다.
          b64() { printf '%s' "$1" | base64 | tr -d '\n'; }

          REF_B64="$(b64 "$GITHUB_REF_NAME")"
          # 이미지 태그에는 v 접두사가 없다 (git v0.3.1 -> 이미지 0.3.1).
          TAG_B64="$(b64 "${GITHUB_REF_NAME#v}")"
          DB_B64="$(b64 "$NULLUS_DB_PASSWORD")"
          KEY_B64="$(b64 "$NULLUS_ENCRYPTION_KEY")"

          # 스크립트 본문은 따옴표 친 heredoc('EOF')이라 로컬에서 전개되지 않는다.
          # 값은 앞줄에서 base64 로만 주입하고, 비밀값은 stdin 으로만 흐른다
          # (ssh 인자에 실으면 러너의 프로세스 목록에 노출된다).
          {
            printf 'REF=$(printf %%s %s | base64 -d)\n' "$REF_B64"
            printf 'IMAGE_TAG=$(printf %%s %s | base64 -d)\n' "$TAG_B64"
            printf 'NULLUS_DB_PASSWORD=$(printf %%s %s | base64 -d)\n' "$DB_B64"
            printf 'NULLUS_ENCRYPTION_KEY=$(printf %%s %s | base64 -d)\n' "$KEY_B64"
            cat <<'EOF'
          set -euo pipefail
          cd ~/nullus
          git fetch --tags --force origin
          git checkout --detach "$REF"

          helm --kube-context=platform upgrade --install nullus deploy/helm/nullus \
            --namespace nullus --create-namespace \
            -f deploy/csp/zadara/values-zadara.yaml \
            --set secrets.dbPassword="$NULLUS_DB_PASSWORD" \
            --set postgresql.auth.password="$NULLUS_DB_PASSWORD" \
            --set secrets.encryptionKey="$NULLUS_ENCRYPTION_KEY" \
            --set api.image.tag="$IMAGE_TAG" \
            --set web.image.tag="$IMAGE_TAG" \
            --wait --timeout 900s

          # kubectl 의 컨텍스트 플래그는 --context 다 (--kube-context 는 helm 전용).
          kubectl --context=platform -n nullus rollout status deployment/nullus-api --timeout=300s
          kubectl --context=platform -n nullus rollout status deployment/nullus-web --timeout=300s
          EOF
          } | ssh -o BatchMode=yes "${ZADARA_USER}@${ZADARA_HOST}" 'bash -s'

      - name: Verify public endpoints
        run: |
          set -euo pipefail
          # 파드가 Ready 인 것과 밖에서 실제로 열리는 것은 다르다. 공개 경로로 확인한다.
          for url in \
            "https://nullus.io/" \
            "https://auth.nullus.io/realms/nullus/.well-known/openid-configuration"; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)"
            echo "  $url -> $code"
            [ "$code" = "200" ] || { echo "검증 실패: $url 이 200 이 아닙니다" >&2; exit 1; }
          done
