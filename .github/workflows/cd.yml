name: CD

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - phase1

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-api:
    name: Build & Push API Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/nullus-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=,format=short

      - name: Build and push API image (linux/amd64,linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-web:
    name: Build & Push Web Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/nullus-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=,format=short

      - name: Build and push Web image (linux/amd64,linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          # OIDC SSO 빌드 설정을 정적 번들에 주입 (repo Variables 로 오버라이드 가능)
          build-args: |
            VITE_AUTH_MODE=${{ vars.VITE_AUTH_MODE || 'oidc' }}
            VITE_OIDC_PROVIDER=${{ vars.VITE_OIDC_PROVIDER || 'keycloak' }}
            VITE_OIDC_AUTHORITY=${{ vars.VITE_OIDC_AUTHORITY || 'http://keycloak.nullus.internal/realms/nullus' }}
            VITE_OIDC_CLIENT_ID=${{ vars.VITE_OIDC_CLIENT_ID || 'nullus-app' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 태그 push 시에만 Helm 차트를 ghcr OCI 레지스트리에 게시한다 (릴리즈 정책 §7.2).
  # 이미지와 동일한 레지스트리·인증을 쓰므로 별도 gh-pages 운영이 필요 없다.
  publish-chart:
    name: Package & Push Helm Chart
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to the Container registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" \
            | helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin

      - name: Package & push chart
        run: |
          # 차트 version/appVersion 은 태그에서 주입한다 — Chart.yaml 커밋값은 clone 설치용 기본값
          VERSION="${GITHUB_REF_NAME#v}"
          helm dependency update deploy/helm/nullus
          helm package deploy/helm/nullus --version "$VERSION" --app-version "$VERSION"
          helm push "nullus-${VERSION}.tgz" oci://ghcr.io/cloud-nullus/charts
