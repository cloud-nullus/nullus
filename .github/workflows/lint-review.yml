name: Lint Review

on:
  pull_request:
    # synchronize 가 없으면 지적을 고쳐 push 해도 검사가 다시 돌지 않아, 통과시키려면
    # PR 을 close/reopen 해야 했다. edited 는 제목·본문을 고쳤을 때 컨벤션 체크가
    # 다시 돌게 한다.
    types: [opened, reopened, synchronize, edited]
    branches: [main]
  issue_comment:
    types: [created]        # /review, /describe 같은 명령어 지원
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ─────────────────────────────────────────
  # PR Convention Check
  # ─────────────────────────────────────────
  pr-convention:
    name: 📋 PR Convention Check
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const body  = context.payload.pull_request.body ?? '';

            // §3.2 PR 제목: <type>(<module>): <description>
            // 모듈은 선택(공통 작업은 생략 가능)
            const TYPES   = ['feat','fix','refactor','test','docs','chore','perf','ci'];
            const MODULES = ['stack','cicd','admin','auth','o11y','product','ui','shared','infra','cli'];

            const titleRe = new RegExp(
              `^(${TYPES.join('|')})(?:\\((${MODULES.join('|')})\\))?!?: .{1,72}$`
            );

            const errors = [];

            if (!titleRe.test(title)) {
              errors.push(
                `**PR 제목** 형식이 올바르지 않습니다.\n` +
                `> \`${title}\`\n\n` +
                `올바른 형식: \`<type>(<module>): <설명>\`\n` +
                `허용 타입: \`${TYPES.join(' | ')}\`\n` +
                `허용 모듈: \`${MODULES.join(' | ')}\``
              );
            }

            // §3.3 PR 본문 필수 섹션 체크
            const requiredSections = ['## Summary', '## Changes', '## Testing'];
            for (const section of requiredSections) {
              if (!body.includes(section)) {
                errors.push(`**PR 본문**에 \`${section}\` 섹션이 없습니다.`);
              }
            }

            // Scope 줄 체크 (템플릿에서 주석 제거 후 작성해야 함)
            const hasScopeLine = /^Scope:\s*\S/m.test(body);
            if (!hasScopeLine) {
              errors.push('**PR 본문**에 `Scope:` 줄이 없거나 비어 있습니다.');
            }

            if (errors.length > 0) {
              const msg = [
                '## ❌ PR 컨벤션 체크 실패',
                '',
                errors.map((e, i) => `${i + 1}. ${e}`).join('\n\n'),
                '',
                '> 참고: [Nullus PR/커밋 컨벤션 가이드](https://github.com/cloud-nullus/draft/blob/main/docs/20_개발가이드/Nullus_PR_커밋_컨벤션.md)',
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: msg,
              });

              core.setFailed(`PR 컨벤션 위반 ${errors.length}건`);
            }

  # ─────────────────────────────────────────
  # Go: golangci-lint → inline PR comments
  # ─────────────────────────────────────────
  golangci-lint:
    name: 🔍 Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint with reviewdog
        uses: reviewdog/action-golangci-lint@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          level: warning
          golangci_lint_flags: >-
            --timeout=5m
            --enable=govet,errcheck,staticcheck,ineffassign

  # ─────────────────────────────────────────
  # React: ESLint → inline PR comments
  # ─────────────────────────────────────────
  eslint:
    name: 🔍 ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint with reviewdog
        uses: reviewdog/action-eslint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          level: warning
          workdir: web
          eslint_flags: 'src/ --ext .js,.jsx,.ts,.tsx'

  # ─────────────────────────────────────────
  # React: Prettier format check
  # ─────────────────────────────────────────
  prettier:
    name: 💅 Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier check with reviewdog
        uses: EPMatt/reviewdog-action-prettier@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          level: warning
          workdir: web

  # ─────────────────────────────────────────
  # CHANGELOG: 항목 누락과 릴리즈 중복 차단
  # ─────────────────────────────────────────
  changelog:
    name: 📝 CHANGELOG Check
    # issue_comment 로도 이 워크플로가 도는데, 그때는 PR diff 를 잡을 수 없다.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # base 와의 공통 조상을 찾아야 PR 이 실제로 바꾼 파일만 나온다.
          fetch-depth: 0

      - name: 변경 파일 목록 수집
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          # quotePath=false 가 없으면 한글 경로가 따옴표로 감싸여 나와
          # docs/ 면제 패턴을 빗나간다. 이 저장소는 문서 경로가 전부 한글이다.
          git -c core.quotePath=false diff --name-only \
            "origin/${BASE_REF}...HEAD" > changed-files.txt
          echo "변경 파일 $(wc -l < changed-files.txt)건"

      - name: CHANGELOG 검사
        env:
          # 정말 필요 없는 PR 은 라벨로 빠져나간다. 구조 검사는 그래도 돈다.
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') && '--skip-entry-check' || '' }}
        run: python3 scripts/check_changelog.py --changed changed-files.txt $SKIP
