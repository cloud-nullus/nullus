name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: nullus_test
          POSTGRES_USER: nullus
          POSTGRES_PASSWORD: nullus_test
        ports: ['5433:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod 에서 읽는다. 손으로 적으면 갈라지고, 실제로 갈라져 있었다 —
          # 워크플로는 1.24 를 설치하는데 go.mod 는 1.26.1 을 요구했다.
          go-version-file: go.mod
      # 차트 렌더 검사에 필요하다. 백업 기능은 코드 테스트를 전부 통과하고도
      # 차트로는 켤 방법이 없는 상태로 한동안 있었다 — 배선의 결함은 코드
      # 테스트로 잡히지 않아서, 차트를 실제로 렌더해 보는 검사가 따로 있다
      # (deploy/helm/nullus/tests). helm 이 없으면 그 검사가 조용히 skip 된다.
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - run: go build ./...
      - run: ./scripts/check-coverage.sh
      # check-coverage.sh 는 ./internal/... 만 돈다. 차트 검사는 그 밖이라
      # 여기서 따로 부른다.
      - run: go test ./deploy/... -count=1
      - run: go vet ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci

      # DESIGN.md 와 생성물(src/theme/tokens.generated.*)이 어긋났는지 먼저 본다.
      # 생성물을 손으로 고치거나 DESIGN.md 만 고치고 재생성을 잊으면 여기서 걸린다.
      - name: 테마 생성물 신선도 검사
        run: npm run theme:check

      - run: npx vite build
      - run: npx vitest run --coverage

      # 디자인 단일 출처 게이트 — DESIGN.md 의 깨진 토큰 참조와 WCAG 대비 미달을 막는다.
      # 종료 코드에 의존하지 않고 summary.errors 를 직접 읽는다.
      # 값의 실제 대비는 src/__tests__/contrast-audit.test.ts 가 index.css 기준으로 검사한다.
      - name: DESIGN.md lint
        run: |
          npx --yes @google/design.md@latest lint DESIGN.md > design-lint.json || true
          cat design-lint.json
          node -e "
            const { summary } = require('./design-lint.json');
            console.log('errors=' + summary.errors + ' warnings=' + summary.warnings);
            if (summary.errors > 0) {
              console.error('DESIGN.md lint 에러 ' + summary.errors + '건 — 병합 불가');
              process.exit(1);
            }
          "

      # 화면 정보 인벤토리 게이트 — 개편으로 필드·컬럼·라벨·문자열이 사라지지 않았는지 본다.
      # 다른 파일로 옮겨간 항목은 유실로 보지 않으므로 컴포넌트 추출을 막지 않는다.
      - name: 화면 정보 인벤토리 대조
        run: npm run inventory:check

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # continue-on-error 를 뗐다. 이 잡이 빨간 상태로 5개월을 지나는 동안 어떤 회귀도
    # PR 을 막지 못했고, 실패 78 건 중 58 건은 리눅스 시각 회귀 베이스라인이 없어서,
    # 나머지는 여기 DB 자격증명이 어긋나 API 가 죽어 있어서였다 — 둘 다 아래에서
    # 고쳤다. 이제 실패는 진짜 실패다.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: nullus_test
          POSTGRES_USER: nullus
          POSTGRES_PASSWORD: nullus_test
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod 에서 읽는다. 손으로 적으면 갈라지고, 실제로 갈라져 있었다 —
          # 워크플로는 1.24 를 설치하는데 go.mod 는 1.26.1 을 요구했다.
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Build API
        run: go build -o bin/api ./cmd/api
      - name: Run migrations
        run: |
          # `|| true` 를 뗐다. 마이그레이션이 깨져도 조용히 넘어가면 그 다음의
          # 모든 실패가 엉뚱한 곳을 가리킨다. ON_ERROR_STOP 으로 파일 안 오류도 잡는다.
          for f in db/migrations/*.up.sql; do
            PGPASSWORD=nullus_test psql -h localhost -p 5433 -U nullus -d nullus_test \
              -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Start API
        env:
          # 이름·계정·비밀번호가 빠져 있었다. 그러면 configs/config.yaml 의 기본값
          # (nullus / nullus / nullus_dev)으로 붙는데, 위 postgres 서비스가 만든 것은
          # nullus_test / nullus / nullus_test 다. 그래서 API 는 떠 있지만 DB 에는
          # 한 번도 붙지 못했고, 데이터를 읽는 E2E 는 전부 30 초 타임아웃으로 죽었다.
          NULLUS_DATABASE_HOST: localhost
          NULLUS_DATABASE_PORT: '5433'
          NULLUS_DATABASE_NAME: nullus_test
          NULLUS_DATABASE_USER: nullus
          NULLUS_DATABASE_PASSWORD: nullus_test
          NULLUS_SERVER_MODE: development
        run: |
          nohup bin/api > /tmp/api.log 2>&1 &
          # sleep 3 은 기동을 보장하지 못한다. 게다가 /health 는 DB 가 끊겨도
          # status:healthy 를 돌려주므로 db 필드까지 봐야 한다 — 그 구분이 없으면
          # DB 없이 돌던 이번 상황이 그대로 재현된다.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8090/health | grep -q '"db":"connected"'; then
              echo "API up with database"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "API failed to reach the database within 60s"
              curl -s http://localhost:8090/health || true
              echo '--- api log ---'
              cat /tmp/api.log || true
              exit 1
            fi
            sleep 2
          done
      - name: Install frontend deps
        run: cd web && npm ci
      - name: Install Playwright browsers
        run: cd web && npx playwright install --with-deps chromium
      - name: Build frontend
        run: cd web && npx vite build
      - name: Run E2E tests
        run: cd web && npx playwright test --project=chromium --reporter=list
        env:
          VITE_API_URL: http://localhost:8090
