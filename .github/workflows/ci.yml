name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: nullus_test
          POSTGRES_USER: nullus
          POSTGRES_PASSWORD: nullus_test
        ports: ['5433:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go build ./...
      - run: ./scripts/check-coverage.sh
      - run: go vet ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vite build
      - run: npx vitest run --coverage

      # 디자인 단일 출처 게이트 — DESIGN.md 의 깨진 토큰 참조와 WCAG 대비 미달을 막는다.
      # 종료 코드에 의존하지 않고 summary.errors 를 직접 읽는다.
      # 값의 실제 대비는 src/__tests__/contrast-audit.test.ts 가 index.css 기준으로 검사한다.
      - name: DESIGN.md lint
        run: |
          npx --yes @google/design.md@latest lint DESIGN.md > design-lint.json || true
          cat design-lint.json
          node -e "
            const { summary } = require('./design-lint.json');
            console.log('errors=' + summary.errors + ' warnings=' + summary.warnings);
            if (summary.errors > 0) {
              console.error('DESIGN.md lint 에러 ' + summary.errors + '건 — 병합 불가');
              process.exit(1);
            }
          "

      # 화면 정보 인벤토리 게이트 — 개편으로 필드·컬럼·라벨·문자열이 사라지지 않았는지 본다.
      # 다른 파일로 옮겨간 항목은 유실로 보지 않으므로 컴포넌트 추출을 막지 않는다.
      - name: 화면 정보 인벤토리 대조
        run: npm run inventory:check

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: nullus_test
          POSTGRES_USER: nullus
          POSTGRES_PASSWORD: nullus_test
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Build API
        run: go build -o bin/api ./cmd/api
      - name: Run migrations
        run: |
          for f in db/migrations/*.up.sql; do
            PGPASSWORD=nullus_test psql -h localhost -p 5433 -U nullus -d nullus_test -f "$f" || true
          done
      - name: Start API
        run: |
          NULLUS_DATABASE_HOST=localhost NULLUS_DATABASE_PORT=5433 NULLUS_SERVER_MODE=development bin/api &
          sleep 3
      - name: Install frontend deps
        run: cd web && npm ci
      - name: Install Playwright browsers
        run: cd web && npx playwright install --with-deps chromium
      - name: Build frontend
        run: cd web && npx vite build
      - name: Run E2E tests
        run: cd web && npx playwright test --reporter=list
        env:
          VITE_API_URL: http://localhost:8090
