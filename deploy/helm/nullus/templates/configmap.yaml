apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nullus.fullname" . }}-config
  labels:
    {{- include "nullus.labels" . | nindent 4 }}
data:
  config.yaml: |
    server:
      port: 8080
      mode: {{ .Values.config.server.mode | quote }}

    database:
      host: {{ include "nullus.database.host" . | quote }}
      port: {{ include "nullus.database.port" . }}
      name: {{ include "nullus.database.name" . | quote }}
      user: {{ include "nullus.database.username" . | quote }}
      password: {{ include "nullus.database.password" . | quote }}
      sslmode: {{ .Values.config.database.sslmode | quote }}
      max_open_conns: {{ .Values.config.database.maxOpenConns }}
      max_idle_conns: {{ .Values.config.database.maxIdleConns }}
      conn_max_lifetime: {{ .Values.config.database.connMaxLifetime | quote }}
      conn_max_idle_time: {{ .Values.config.database.connMaxIdleTime | quote }}

    auth:
      mode: {{ .Values.config.auth.mode | quote }}
      session:
        secret: {{ .Values.secrets.encryptionKey | quote }}
        max_age: {{ .Values.config.auth.sessionMaxAge }}
      oidc:
        issuer_url: {{ .Values.config.auth.oidcIssuerUrl | quote }}
        audience: {{ .Values.config.auth.oidcAudience | quote }}

    helm:
      timeout: {{ .Values.config.helm.timeout | quote }}
      namespace_prefix: {{ .Values.config.helm.namespacePrefix | quote }}

    prometheus:
      url: {{ .Values.config.prometheus.url | quote }}

    log:
      level: {{ .Values.config.log.level | quote }}
      format: {{ .Values.config.log.format | quote }}

    {{- with .Values.config.backup }}
    # 백업/복구 (docs/11_기능설계/Nullus_백업복구_설계.md)
    #
    # 비밀값은 여기 담지 않는다 — 봉인 키 · 목적지 secret key · Keycloak DB
    # 비밀번호는 Secret 에서 환경변수로 주입한다(deployment.yaml). ConfigMap 은
    # RBAC 이 느슨하고 그대로 로그·백업본에 실려 나가기 쉽다. 설계 §5.2 가
    # 지키려는 것이 정확히 그 지점이다.
    #
    # (위 database.password 는 이 기능 이전부터 있던 배선이다. 함께 옮기는 것이
    #  맞지만 백업과 범위가 달라 건드리지 않았다.)
    backup:
      enabled: {{ .enabled }}
      seal_key_id: {{ .sealKeyId | quote }}
      destination:
        endpoint: {{ .destination.endpoint | quote }}
        bucket: {{ .destination.bucket | quote }}
        access_key: {{ .destination.accessKey | quote }}
        region: {{ .destination.region | quote }}
        use_ssl: {{ .destination.useSsl }}
        prefix: {{ .destination.prefix | quote }}
      keycloak_database:
        host: {{ .keycloakDatabase.host | quote }}
        port: {{ .keycloakDatabase.port }}
        name: {{ .keycloakDatabase.name | quote }}
        user: {{ .keycloakDatabase.user | quote }}
      schedule:
        enabled: {{ .schedule.enabled }}
        interval: {{ .schedule.interval | quote }}
        org_id: {{ .schedule.orgId | quote }}
        stack_id: {{ .schedule.stackId | quote }}
        namespace: {{ .schedule.namespace | quote }}
        mode: {{ .schedule.mode | quote }}
      retention:
        daily: {{ .retention.daily }}
        weekly: {{ .retention.weekly }}
        monthly: {{ .retention.monthly }}
        max_total_bytes: {{ .retention.maxTotalBytes }}
    {{- end }}
