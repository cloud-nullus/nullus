apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nullus.fullname" . }}-api
  labels:
    {{- include "nullus.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "nullus.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "nullus.api.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nullus.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
      - name: merge-ca-certs
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
        command:
        - sh
        - -c
        - |
          # 사설 CA(nullus-wildcard-tls)는 선택 사항이다. 없으면 시스템 번들만 쓴다.
          if [ -f /nullus-ca/ca.crt ]; then
            cat /etc/ssl/certs/ca-certificates.crt /nullus-ca/ca.crt > /ssl-merged/ca-certificates.crt
            echo "CA bundle merged ($(wc -l < /ssl-merged/ca-certificates.crt) lines)"
          else
            cp /etc/ssl/certs/ca-certificates.crt /ssl-merged/ca-certificates.crt
            echo "custom CA not mounted - using system bundle only"
          fi
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - name: nullus-ca
          mountPath: /nullus-ca
          readOnly: true
        - name: ssl-certs
          mountPath: /ssl-merged
      - name: wait-for-db
        image: busybox:1.37
        command:
        - sh
        - -c
        - |
          echo "Waiting for PostgreSQL..."
          until nc -z {{ include "nullus.database.host" . }} {{ include "nullus.database.port" . }}; do
            sleep 2
          done
          echo "PostgreSQL is reachable"
      containers:
      - name: api
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.api.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: NULLUS_SERVER_PORT
          value: "8080"
        # 플랫폼이 자기 네임스페이스를 알아야 스택 설치·삭제가 그 자리를 피한다.
        # 값을 차트에 적지 않고 Downward API 로 받는 이유는, 릴리스를 다른
        # 네임스페이스에 깔아도 저절로 맞기 때문이다.
        - name: NULLUS_PLATFORM_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NULLUS_DATABASE_HOST
          value: {{ include "nullus.database.host" . }}
        - name: NULLUS_DATABASE_PORT
          value: {{ include "nullus.database.port" . | quote }}
        - name: NULLUS_DATABASE_NAME
          value: {{ include "nullus.database.name" . }}
        - name: NULLUS_DATABASE_USER
          value: {{ include "nullus.database.username" . }}
        - name: NULLUS_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "nullus.fullname" . }}
              key: db-password
        - name: NULLUS_DATABASE_SSLMODE
          value: {{ .Values.config.database.sslmode | quote }}
        - name: NULLUS_DATABASE_MAX_OPEN_CONNS
          value: {{ .Values.config.database.maxOpenConns | quote }}
        - name: NULLUS_DATABASE_MAX_IDLE_CONNS
          value: {{ .Values.config.database.maxIdleConns | quote }}
        - name: NULLUS_DATABASE_CONN_MAX_LIFETIME
          value: {{ .Values.config.database.connMaxLifetime | quote }}
        - name: NULLUS_DATABASE_CONN_MAX_IDLE_TIME
          value: {{ .Values.config.database.connMaxIdleTime | quote }}
        - name: NULLUS_AUTH_MODE
          value: {{ .Values.config.auth.mode | quote }}
        - name: NULLUS_AUTH_SESSION_MAX_AGE
          value: {{ .Values.config.auth.sessionMaxAge | quote }}
        {{- if .Values.config.auth.oidcIssuerUrl }}
        - name: NULLUS_AUTH_OIDC_ISSUER_URL
          value: {{ .Values.config.auth.oidcIssuerUrl | quote }}
        - name: NULLUS_AUTH_OIDC_AUDIENCE
          value: {{ .Values.config.auth.oidcAudience | quote }}
        {{- end }}
        # 설치되는 OSS 의 OIDC 클라이언트를 등록할 Keycloak 관리자 자격.
        # 주소가 없으면 아무것도 넣지 않는다 — API 가 SSO 프로비저닝을 건너뛴다.
        {{- $kcAdminUrl := include "nullus.keycloak.adminUrl" . }}
        {{- if $kcAdminUrl }}
        - name: NULLUS_KEYCLOAK_ADMIN_URL
          value: {{ $kcAdminUrl | quote }}
        - name: NULLUS_KEYCLOAK_REALM
          value: {{ .Values.config.keycloak.realm | quote }}
        {{- if .Values.config.keycloak.publicUrl }}
        - name: NULLUS_KEYCLOAK_PUBLIC_URL
          value: {{ .Values.config.keycloak.publicUrl | quote }}
        {{- end }}
        - name: NULLUS_KEYCLOAK_ADMIN_USER
          value: {{ .Values.config.keycloak.adminUser | quote }}
        - name: NULLUS_KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "nullus.keycloak.adminPasswordSecretName" . }}
              key: {{ include "nullus.keycloak.adminPasswordSecretKey" . }}
        {{- end }}
        # 자체서명 CA를 포함한 merged CA bundle 경로 (initContainer가 생성)
        - name: SSL_CERT_FILE
          value: /ssl-certs/ca-certificates.crt
        - name: NULLUS_HELM_TIMEOUT
          value: {{ .Values.config.helm.timeout | quote }}
        - name: NULLUS_HELM_NAMESPACE_PREFIX
          value: {{ .Values.config.helm.namespacePrefix | quote }}
        {{- if .Values.config.helm.ociRegistry }}
        # airgap: 스택 차트를 온라인 레포 대신 로컬 OCI 레지스트리에서 pull
        - name: NULLUS_HELM_OCI_REGISTRY
          value: {{ .Values.config.helm.ociRegistry | quote }}
        {{- end }}
        # 오케스트레이터가 helm CLI 를 실행하는데 컨테이너 루트가 readOnlyRootFilesystem
        # 이라 기본 캐시 경로(HOME/.cache)에 쓰지 못한다(Error: mkdir /.cache: read-only).
        # helm 캐시/설정/데이터 및 HOME 을 쓰기 가능한 /tmp 로 돌린다.
        - name: HOME
          value: /tmp
        - name: HELM_CACHE_HOME
          value: /tmp/.helm/cache
        - name: HELM_CONFIG_HOME
          value: /tmp/.helm/config
        - name: HELM_DATA_HOME
          value: /tmp/.helm/data
        {{- if .Values.config.prometheus.url }}
        - name: NULLUS_PROMETHEUS_URL
          value: {{ .Values.config.prometheus.url | quote }}
        {{- end }}
        - name: NULLUS_LOG_LEVEL
          value: {{ .Values.config.log.level | quote }}
        - name: NULLUS_LOG_FORMAT
          value: {{ .Values.config.log.format | quote }}
        # 코드는 os.Getenv("ENCRYPTION_KEY") 로 읽는다(접두사 없음).
        # 이전 NULLUS_ENCRYPTION_KEY 는 코드와 불일치해 클러스터 등록이
        # "ENCRYPTION_KEY must be 32 bytes" 로 실패했다.
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "nullus.fullname" . }}
              key: encryption-key
        {{- if .Values.config.backup.enabled }}
        # 백업 비밀값은 ConfigMap 을 거치지 않는다 (configmap.yaml 주석 참고).
        - name: NULLUS_BACKUP_SEAL_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "nullus.fullname" . }}
              key: backup-seal-key
        - name: NULLUS_BACKUP_DESTINATION_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "nullus.fullname" . }}
              key: backup-destination-secret-key
        - name: NULLUS_BACKUP_KEYCLOAK_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "nullus.fullname" . }}
              key: backup-keycloak-db-password
        {{- end }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.api.resources | nindent 12 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: config
          mountPath: /configs
          readOnly: true
        - name: ssl-certs
          mountPath: /ssl-certs
          readOnly: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: config
        configMap:
          name: {{ include "nullus.fullname" . }}-config
      - name: nullus-ca
        secret:
          secretName: {{ .Values.caBundle.secretName }}
          # 시크릿이 없으면 빈 디렉토리로 마운트된다. optional 이 없으면 파드가
          # FailedMount 로 Pending 에 갇혀 기본값 설치가 아예 되지 않는다.
          optional: true
          items:
          - key: ca.crt
            path: ca.crt
      - name: ssl-certs
        emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nullus.fullname" . }}-web
  labels:
    {{- include "nullus.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "nullus.web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nullus.web.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
      - name: web
        image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.web.image.pullPolicy }}
        # 런타임 설정. 컨테이너가 기동 시 /config.js 를 만들어 SPA 에 전달한다.
        # 이 값들이 없으면 앱은 이미지에 빌드된 값으로 폴백한다.
        env:
        - name: NULLUS_AUTH_MODE
          value: {{ .Values.web.auth.mode | quote }}
        - name: NULLUS_OIDC_PROVIDER
          value: {{ .Values.web.auth.oidcProvider | quote }}
        - name: NULLUS_OIDC_AUTHORITY
          value: {{ .Values.web.auth.oidcAuthority | quote }}
        - name: NULLUS_OIDC_CLIENT_ID
          value: {{ .Values.web.auth.oidcClientId | quote }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.web.resources | nindent 12 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: cache
          mountPath: /var/cache/nginx
        - name: run
          mountPath: /var/run
        # 기동 시 생성하는 /config.js 를 둘 곳. 루트 파일시스템이 읽기 전용이라
        # 도큐먼트 루트에는 쓸 수 없다.
        - name: runtime-config
          mountPath: /var/lib/nullus
      volumes:
      - name: cache
        emptyDir: {}
      - name: run
        emptyDir: {}
      - name: runtime-config
        emptyDir: {}
