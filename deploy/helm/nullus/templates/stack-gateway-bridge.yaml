{{- if .Values.gatewayBridge.enabled }}
{{- $hosts := .Values.gatewayBridge.hosts | default list }}
{{- if not $hosts }}
{{- fail "gatewayBridge.enabled 이면 gatewayBridge.hosts 가 필요합니다 (예: [\"*.nullus.io\"])" }}
{{- end }}
# 스택 도구는 공용 Envoy Gateway 로 들어온다. LoadBalancer 가 없는 환경에서는 그
# 게이트웨이가 외부 IP 를 받지 못해, 밖에서 온 요청이 ingress-nginx 에 도착하고
# 규칙이 없어 404 가 난다. 이 브리지가 그 요청을 게이트웨이로 넘긴다.
#
# Ingress 의 백엔드는 같은 네임스페이스여야 해서, 다른 네임스페이스에 사는
# 게이트웨이는 ExternalName 으로 건너간다.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nullus.fullname" . }}-gateway-upstream
  labels:
    {{- include "nullus.labels" . | nindent 4 }}
spec:
  type: ExternalName
  externalName: {{ printf "%s.%s.svc.cluster.local" .Values.gatewayBridge.serviceName .Values.gatewayBridge.gatewayNamespace }}
  ports:
    - name: http
      port: 80
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nullus.fullname" . }}-gateway-bridge
  labels:
    {{- include "nullus.labels" . | nindent 4 }}
  annotations:
    # 원래 Host 를 그대로 넘긴다. 게이트웨이의 HTTPRoute 가 호스트로 도구를
    # 갈라내므로, 여기서 호스트가 바뀌면 어느 라우트에도 걸리지 않는다.
    nginx.ingress.kubernetes.io/upstream-vhost: $host
    {{- with .Values.gatewayBridge.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.gatewayBridge.tlsSecretName }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ . }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "nullus.fullname" $ }}-gateway-upstream
                port:
                  number: 80
    {{- end }}
{{- end }}
