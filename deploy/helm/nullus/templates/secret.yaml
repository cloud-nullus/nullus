apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nullus.fullname" . }}
  labels:
    {{- include "nullus.labels" . | nindent 4 }}
type: Opaque
data:
  db-password: {{ include "nullus.database.password" . | b64enc | quote }}
  encryption-key: {{ .Values.secrets.encryptionKey | b64enc | quote }}
  {{- if .Values.config.keycloak.adminPassword }}
  keycloak-admin-password: {{ .Values.config.keycloak.adminPassword | b64enc | quote }}
  {{- end }}
