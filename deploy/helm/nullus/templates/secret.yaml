apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nullus.fullname" . }}
  labels:
    {{- include "nullus.labels" . | nindent 4 }}
type: Opaque
data:
  db-password: {{ include "nullus.database.password" . | b64enc | quote }}
  encryption-key: {{ .Values.secrets.encryptionKey | b64enc | quote }}
  {{- if .Values.config.keycloak.adminPassword }}
  keycloak-admin-password: {{ .Values.config.keycloak.adminPassword | b64enc | quote }}
  {{- end }}
  {{- if .Values.config.backup.enabled }}
  # 백업 산출물 봉인 키. ENCRYPTION_KEY 와 **다른 값**이어야 한다 —
  # 같으면 백업본 하나가 새는 순간 등록된 모든 클러스터가 함께 열린다(§5.2).
  # 코드가 같은 값이면 기동을 막는다.
  backup-seal-key: {{ required "config.backup.enabled=true 이면 secrets.backupSealKey 가 필요합니다 (32바이트)" .Values.secrets.backupSealKey | b64enc | quote }}
  # 목적지 자격증명. 스택 OpenBao 가 아니라 컨트롤 플레인에서 온다(§4.2.1) —
  # 금고에서 조달하면 스택이 죽을 때 백업본을 가져올 수 없는 순환이 생긴다.
  backup-destination-secret-key: {{ required "config.backup.enabled=true 이면 secrets.backupDestinationSecretKey 가 필요합니다" .Values.secrets.backupDestinationSecretKey | b64enc | quote }}
  {{- end }}
