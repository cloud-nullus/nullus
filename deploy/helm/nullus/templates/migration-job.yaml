{{- if .Values.migration.enabled }}
{{- /*
DB 스키마/시드를 새 코드가 뜨기 전에 적용한다.

이 자리는 오랫동안 "마이그레이션은 golang-migrate CLI 나 CI/CD 로 밖에서
처리한다"는 주석뿐인 빈 파일이었다. 그런데 밖에서 돌리는 쪽은 airgap 설치기와
vm-cluster 런북뿐이고, 정작 nullus.io 를 올리는 CD(.github/workflows/cd.yml)는
helm upgrade 와 rollout restart 만 한다. 그래서 배포 DB 는 누군가 손으로 migrate
를 돌린 시점에 멈춰 있었다 — 스택 템플릿은 전부 seed 마이그레이션으로만 들어오는데
그게 적용된 적이 없어 배포 환경에는 템플릿이 하나도 없었고, users.password_hash
가 없어 ID/PW 로그인은 500 을 냈다. 아무도 실패를 못 본 이유는 helm 이 초록불로
끝나고 파드도 Ready 였기 때문이다.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nullus.fullname" . }}-migrate
  labels:
    {{- include "nullus.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # 설치 때는 post-install 이다. pre-install 로 걸면 아직 만들어지지도 않은
    # PostgreSQL 을 기다리다 타임아웃으로 끝난다 — 훅은 차트 리소스보다 먼저 돈다.
    # 업그레이드 때는 pre-upgrade 여야 한다. 새 코드가 옛 스키마 위에서 도는 창을
    # 없애려면 롤아웃 전에 끝나 있어야 한다.
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    # Job 의 파드 템플릿은 불변이라, 같은 이름이 남아 있으면 다음 배포가
    # "field is immutable" 로 죽는다. 만들기 전에 지운다. hook-succeeded 를 쓰지
    # 않는 것은 성공한 Job 의 로그도 남겨 두기 위해서다.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  {{- with .Values.migration.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "nullus.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nullus.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
      # api Deployment 와 같은 대기다. 첫 설치 때 PostgreSQL 이 아직 연결을 받지
      # 못하는 짧은 구간에서 Job 이 곧장 실패로 끝나지 않도록 한다.
      - name: wait-for-db
        image: busybox:1.37
        command:
        - sh
        - -c
        - |
          echo "Waiting for PostgreSQL..."
          until nc -z {{ include "nullus.database.host" . }} {{ include "nullus.database.port" . }}; do
            sleep 2
          done
          echo "PostgreSQL is reachable"
      containers:
      # 지금 올라가는 바로 그 api 이미지를 쓴다. SQL(/etc/nullus/migrations)과
      # migrate CLI 가 모두 그 안에 있으므로, 코드와 스키마의 세대가 어긋날 수 없다.
      - name: migrate
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.api.image.pullPolicy }}
        command:
        - sh
        - -c
        - |
          set -eu
          # set -x 를 켜지 않는다 — 접속 URL 에 비밀번호가 들어 있어 Job 로그로 샌다.

          # 비밀번호를 URL 에 그대로 끼우면 @ : / ? # 같은 글자에서 URL 이 갈라진다.
          # 예약 문자만 퍼센트 인코딩한다(% 를 가장 먼저 바꿔야 이중 인코딩이 없다).
          PW="$(printf '%s' "$NULLUS_DATABASE_PASSWORD" | sed \
            -e 's/%/%25/g' -e 's/:/%3A/g' -e 's|/|%2F|g' -e 's/?/%3F/g' \
            -e 's/#/%23/g' -e 's/\[/%5B/g' -e 's/\]/%5D/g' -e 's/@/%40/g' \
            -e 's/ /%20/g')"
          USER_ENC="$(printf '%s' "$NULLUS_DATABASE_USER" | sed \
            -e 's/%/%25/g' -e 's/:/%3A/g' -e 's|/|%2F|g' -e 's/@/%40/g')"

          migrate -path /etc/nullus/migrations \
            -database "postgres://${USER_ENC}:${PW}@${NULLUS_DATABASE_HOST}:${NULLUS_DATABASE_PORT}/${NULLUS_DATABASE_NAME}?sslmode=${NULLUS_DATABASE_SSLMODE}" \
            up

          echo "migration done"
        env:
        # api Deployment 와 **같은 출처** 에서 끌어온다. 값을 따로 적어 두면 한쪽만
        # 고쳤을 때 마이그레이션은 성공했는데 API 가 보는 DB 에는 반영이 없다.
        - name: NULLUS_DATABASE_HOST
          value: {{ include "nullus.database.host" . }}
        - name: NULLUS_DATABASE_PORT
          value: {{ include "nullus.database.port" . | quote }}
        - name: NULLUS_DATABASE_NAME
          value: {{ include "nullus.database.name" . }}
        - name: NULLUS_DATABASE_USER
          value: {{ include "nullus.database.username" . }}
        - name: NULLUS_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "nullus.fullname" . }}
              key: db-password
        - name: NULLUS_DATABASE_SSLMODE
          value: {{ .Values.config.database.sslmode | quote }}
        {{- with .Values.migration.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
{{- end }}
