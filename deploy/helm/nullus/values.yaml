# 사설 레지스트리 이미지 pull 용 시크릿 (예: [{name: ghcr-pull-secret}]). 비우면 미적용.
imagePullSecrets: []

api:
  replicaCount: 2
  image:
    repository: ghcr.io/cloud-nullus/nullus/nullus-api
    tag: ""   # 비우면 Chart.AppVersion 으로 폴백. 로컬 빌드는 values-dev.yaml 사용
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources: {}

web:
  replicaCount: 2
  image:
    repository: ghcr.io/cloud-nullus/nullus/nullus-web
    tag: ""   # 비우면 Chart.AppVersion 으로 폴백. 로컬 빌드는 values-dev.yaml 사용
    pullPolicy: IfNotPresent
  # SPA 런타임 설정. Vite 는 VITE_* 를 빌드 시점에 인라인하므로, 이 값들이 없으면
  # 환경마다 이미지를 다시 빌드해야 한다. 컨테이너가 기동 시 /config.js 로 주입한다.
  # 비워 두면 이미지에 빌드된 기본값을 그대로 쓴다.
  auth:
    # SPA 도 백엔드(config.auth.mode)와 **같은 모드** 여야 한다. 어긋나면 프론트가
    # session 헤더를 보내는데 API 는 JWT 를 기다려 전부 401 이 된다.
    # 비우면 이미지 기본값(session)이라, 백엔드 기본값에 맞춰 oidc 로 둔다.
    mode: oidc          # oidc | session
    oidcProvider: ""    # keycloak | authentik
    # 브라우저가 직접 접근하는 주소여야 한다 — 클러스터 내부 주소를 넣으면 안 된다.
    # 예: http://nullus.example.com/auth/realms/nullus
    oidcAuthority: ""
    oidcClientId: ""
  service:
    type: ClusterIP
    port: 80
  resources: {}

config:
  server:
    mode: production
  database:
    port: 5432
    sslmode: disable
    maxOpenConns: 25
    maxIdleConns: 10
    connMaxLifetime: 5m
    connMaxIdleTime: 1m
  auth:
    # oidc 가 기본값이다. session 은 클라이언트가 보낸 X-User-* 헤더를 그대로 믿는
    # 알파 시절 방식이라 사실상 무인증이다 — 아무나 X-User-Role: admin 을 붙일 수 있다.
    # oidc 를 쓰려면 아래 oidcIssuerUrl 과 web.auth.* 를 반드시 채워야 한다.
    # 비워 두면 API 가 기동 시점에 명시적으로 실패한다(전부 401 로 헤매지 않도록).
    mode: oidc
    sessionMaxAge: 86400
    # IdP 가 토큰에 찍는 issuer 와 **문자열이 같아야** 한다. 브라우저가 접근하는 공개 주소다.
    # 예: https://auth.example.com/realms/nullus
    oidcIssuerUrl: ""
    oidcAudience: nullus-app
  # 스택이 설치하는 OSS(GitLab/Grafana/ArgoCD/Harbor/MinIO)의 OIDC 클라이언트를
  # 자동 등록할 Keycloak 관리자 자격이다(설치 파이프라인의 provisioning_sso 단계).
  #
  # adminUrl 을 비우면 keycloak.enabled=true 인 경우 클러스터 내부 서비스로
  # 자동 연결된다. 외부 Keycloak(BYO)을 쓸 때만 주소와 adminPassword 를 채운다.
  # 둘 다 비고 keycloak.enabled=false 이면 SSO 프로비저닝은 꺼진 채 동작한다 —
  # 이때 설치되는 OSS 는 각자 로컬 admin 계정으로 뜬다.
  keycloak:
    adminUrl: ""
    # 설치되는 OSS 가 브라우저를 보낼 Keycloak 주소. 비우면 auth.oidcIssuerUrl 을
    # 물려받는다 — 포털과 같은 오리진이어야 SSO 세션이 이어지므로 대개 그게 맞다.
    publicUrl: ""
    realm: nullus
    adminUser: admin
    # 서브차트를 쓰면 비워 둔다 — Keycloak 차트가 만든 시크릿을 그대로 참조한다.
    adminPassword: ""
  helm:
    timeout: 600s
    namespacePrefix: nullus-
    ociRegistry: ""   # airgap: 로컬 OCI 레지스트리(host/path). 빈 값이면 온라인 레포 사용
  prometheus:
    url: ""
  log:
    level: info
    format: json

# 사설 CA 번들. API 파드가 사내 CA 로 서명된 엔드포인트를 호출해야 할 때만 쓴다.
# 시크릿(ca.crt 키)이 없으면 시스템 CA 번들만 사용하고 그대로 기동한다.
caBundle:
  secretName: nullus-wildcard-tls

secrets:
  # 번들 PostgreSQL(postgresql.enabled=true)을 쓸 때는 이 값이 무시되고
  # postgresql.auth.password 가 사용된다 — 두 값이 어긋나면 API 가 DB 인증에
  # 실패하므로 차트가 한쪽으로 통일한다(nullus.database.password 헬퍼).
  # 외부 DB(postgresql.enabled=false)일 때만 이 값이 쓰인다.
  dbPassword: change-me
  # AES-256 키라 정확히 32바이트여야 한다. 길이가 다르면 클러스터 등록/조회가
  # "ENCRYPTION_KEY must be 32 bytes" 로 HTTP 500 을 낸다(기동 자체는 된다).
  encryptionKey: change-me-32byte-encryption-key!

# Bitnami 가 2025년에 카탈로그를 정리하면서 docker.io/bitnami/postgresql 의
# 구버전 태그가 bitnamilegacy 네임스페이스로 옮겨갔다. 서브차트 기본값
# (bitnami/postgresql:17.5.0-debian-12-r20)은 더 이상 pull 되지 않으므로
# 동일 다이제스트가 남아 있는 bitnamilegacy 를 가리킨다.
# 비공식 레포로 바꾸면 서브차트의 이미지 검증이 막아서 allowInsecureImages 가 필요하다.
global:
  security:
    allowInsecureImages: true

postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 17.5.0-debian-12-r20
  auth:
    username: nullus
    password: nullus
    database: nullus
  # postgresql.image 와 같은 이유로 os-shell 도 legacy 경로를 쓴다.
  # volumePermissions.enabled=true 인 환경에서만 pull 되지만, 기본값이
  # 유효하지 않은 채로 남아 있으면 켜는 순간 ImagePullBackOff 가 된다.
  volumePermissions:
    image:
      registry: docker.io
      repository: bitnamilegacy/os-shell
      tag: 12-debian-12-r49
  primary:
    service:
      ports:
        postgresql: 5432

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: nullus.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ---------------------------------------------------------------------------
# Keycloak (플랫폼 IdP)
#
# 스택마다 IdP 를 띄우지 않고 플랫폼에 하나를 둔다. 스택 설치기는 이 Keycloak
# 에 OSS 별 OIDC 클라이언트를 등록만 한다.
#
# 외부 IdP 를 쓰는 환경에서는 enabled=false 로 두고 issuer 를 직접 지정한다(BYO).
# ---------------------------------------------------------------------------
keycloak:
  enabled: true
  auth:
    adminUser: admin
    # 운영에서는 반드시 existingSecret 으로 교체한다.
    existingSecret: ""
  production: false
  proxy: edge
  # postgresql 과 같은 이유로 legacy 경로를 쓴다. keycloak 서브차트(24.4.5)의
  # 기본값 bitnami/keycloak:26.1.0-debian-12-r0 과 bitnami/postgresql:17.2.0
  # 은 둘 다 Docker Hub 에서 pull 되지 않는다.
  image:
    registry: docker.io
    repository: bitnamilegacy/keycloak
    tag: 26.1.0-debian-12-r0
  # 서브차트가 자기 PostgreSQL 을 함께 띄운다 — 상위 postgresql 과 별개다.
  # 둘 다 <릴리즈>-postgresql 로 이름이 잡혀 StatefulSet/Service/Secret 등
  # 7종이 그대로 충돌한다. 설치가 "already exists" 로 실패하므로 이름을 분리한다.
  # (keycloak.databaseHost 도 이 값을 따라 nullus-keycloak-postgresql 이 된다)
  # Nullus 로그인 테마. templates/keycloak-theme-configmap.yaml 이 만든 ConfigMap
  # 을 파드에 붙인다. 서브차트 values 는 common.tplvalues.render 를 거치므로
  # 템플릿 문자열을 쓸 수 있지만, nullus.fullname 같은 헬퍼는 안 된다 — 여기서는
  # .Chart 와 .Values 가 keycloak 서브차트 것으로 잡혀 다른 이름이 나온다.
  #
  # theme.properties 는 파일 하나로(subPath), resources 와 messages 는 폴더로
  # 붙인다. 셋 중 어느 것도 다른 것의 상위가 아니라 볼륨이 겹쳐 마운트되지
  # 않는다 — 겹치면 마운트 순서에 기대는 배선이 된다.
  #
  # messages 는 로그인 화면 왼쪽 설명(loginTitleHtml)이 사는 자리다. 빠뜨리면
  # 화면은 뜨는데 왼쪽이 realm 이름 한 줄로 비어 보인다.
  #
  # realm 의 loginTheme 을 "nullus" 로, 그리고 i18n 을 켜야 실제로 쓰인다
  # (scripts/setup-keycloak.sh). 마운트만 있고 realm 설정이 없으면 Keycloak 은
  # 조용히 기본 화면을 낸다.
  extraVolumes:
    - name: nullus-login-theme
      configMap:
        name: '{{ .Release.Name }}-keycloak-theme'
    # 부모 테마의 템플릿이 파비콘을 <resources>/img/favicon.ico 에서 찾는다.
    # ConfigMap 키에는 "/" 를 못 넣지만 projected 볼륨의 items[].path 에는 넣을 수
    # 있다. 두 ConfigMap 을 한 볼륨으로 합치면 마운트 지점은 그대로 하나다 —
    # resources 안에 볼륨을 또 겹쳐 마운트하면 마운트 순서에 기대는 배선이 된다.
    - name: nullus-login-theme-resources
      projected:
        sources:
          - configMap:
              name: '{{ .Release.Name }}-keycloak-theme-resources'
          - configMap:
              name: '{{ .Release.Name }}-keycloak-theme-resources-img'
              items:
                - key: favicon.ico
                  path: img/favicon.ico
    - name: nullus-login-theme-messages
      configMap:
        name: '{{ .Release.Name }}-keycloak-theme-messages'
  extraVolumeMounts:
    - name: nullus-login-theme
      mountPath: /opt/bitnami/keycloak/themes/nullus/login/theme.properties
      subPath: theme.properties
      readOnly: true
    - name: nullus-login-theme-resources
      mountPath: /opt/bitnami/keycloak/themes/nullus/login/resources
      readOnly: true
    - name: nullus-login-theme-messages
      mountPath: /opt/bitnami/keycloak/themes/nullus/login/messages
      readOnly: true
  # 서브차트가 자기 PostgreSQL 을 함께 띄운다 (아래 nameOverride 참고)
  postgresql:
    nameOverride: keycloak-postgresql
    image:
      registry: docker.io
      repository: bitnamilegacy/postgresql
      tag: 17.2.0-debian-12-r6
    volumePermissions:
      image:
        registry: docker.io
        repository: bitnamilegacy/os-shell
        tag: 12-debian-12-r35
