# 사설 레지스트리 이미지 pull 용 시크릿 (예: [{name: ghcr-pull-secret}]). 비우면 미적용.
imagePullSecrets: []

api:
  replicaCount: 2
  image:
    repository: ghcr.io/cloud-nullus/nullus-api
    tag: "0.1.0-alpha"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources: {}

web:
  replicaCount: 2
  image:
    repository: ghcr.io/cloud-nullus/nullus-web
    tag: "0.1.0-alpha"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources: {}

config:
  server:
    mode: production
  database:
    port: 5432
    sslmode: disable
    maxOpenConns: 25
    maxIdleConns: 10
    connMaxLifetime: 5m
    connMaxIdleTime: 1m
  auth:
    mode: session
    sessionMaxAge: 86400
    oidcIssuerUrl: ""
    oidcAudience: nullus-app
  helm:
    timeout: 600s
    namespacePrefix: nullus-
    ociRegistry: ""   # airgap: 로컬 OCI 레지스트리(host/path). 빈 값이면 온라인 레포 사용
  prometheus:
    url: ""
  log:
    level: info
    format: json

secrets:
  dbPassword: change-me
  encryptionKey: change-me-32-bytes-minimum

postgresql:
  enabled: true
  auth:
    username: nullus
    password: nullus
    database: nullus
  primary:
    service:
      ports:
        postgresql: 5432

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: nullus.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ---------------------------------------------------------------------------
# Keycloak (플랫폼 IdP)
#
# 스택마다 IdP 를 띄우지 않고 플랫폼에 하나를 둔다. 스택 설치기는 이 Keycloak
# 에 OSS 별 OIDC 클라이언트를 등록만 한다.
#
# 외부 IdP 를 쓰는 환경에서는 enabled=false 로 두고 issuer 를 직접 지정한다(BYO).
# ---------------------------------------------------------------------------
keycloak:
  enabled: true
  auth:
    adminUser: admin
    # 운영에서는 반드시 existingSecret 으로 교체한다.
    existingSecret: ""
  production: false
  proxy: edge
