# Nullus 로그인 테마.
#
# .ftl 을 복사하지 않는다 — Keycloak 을 올릴 때마다 템플릿을 따라 고쳐야 하고,
# 그 사이 새로 생긴 화면(passkey·organization 등)을 조용히 잃는다. 부모 테마의
# 구조를 그대로 두고 CSS 만 얹는다.
parent=keycloak.v2
import=common/keycloak

# css/styles.css 는 부모 테마에서 온다. nullus.css 가 그 뒤에 와야 덮어쓴다.
#
# 리소스를 하위 폴더 없이 한 단으로 두는 이유: 쿠버네티스에서 이 테마는
# ConfigMap 볼륨으로 들어간다. resources/ 아래를 다시 나누면 볼륨을 중첩해서
# 마운트해야 하고, 마운트 순서에 기대는 배선이 된다.
styles=css/styles.css scene.generated.css nullus.css
# 왼쪽 벨트에 실릴 OSS 셋을 카탈로그에서 골라 CSS 변수에 꽂는다. 순수 CSS 로는
# 난수를 만들 수 없어 이 한 조각만 자바스크립트다 — 막혀도 기본 셋으로 뜬다.
# favicon.js 는 부모 템플릿이 박아 둔 파비콘 링크를 Nullus 마크로 바꾼다.
# 막혀도 키클록 기본 파비콘이 남을 뿐이다.
scripts=pick-oss.js favicon.js
