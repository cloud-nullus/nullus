# =============================================================================
# Zadara Cloud PoC — platform 클러스터용 Helm 값
#
#   helm upgrade --install nullus deploy/helm/nullus \
#     --namespace nullus --create-namespace \
#     -f deploy/csp/zadara/values-zadara.yaml \
#     --set secrets.dbPassword="$DB_PASSWORD" \
#     --set secrets.encryptionKey="$ENCRYPTION_KEY"
#
# 이미지 경로·태그는 차트 기본값(values.yaml + Chart.appVersion)을 그대로 쓴다.
# 다른 버전을 배포하려면 --set api.image.tag=<버전> 으로 덮어쓴다.
# 클러스터 구성은 docs/50_운영/zadara_cloud_poc.md 참조.
# =============================================================================

# -----------------------------------------------------------------------------
# 리소스 배치
#
# node-10(control-plane, 2vCPU/4GB)은 bastion 겸용이라 여유가 없다.
# 워크로드는 node-11(8vCPU/16GB)에만 올라가도록 control-plane taint 를 그대로 두고
# replicaCount 를 1로 낮춘다 — 워커가 1대뿐이라 2로 두면 한 파드가 Pending 된다.
# -----------------------------------------------------------------------------
api:
  replicaCount: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

web:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # SPA 가 기동 시 /config.js 로 받는 값. 브라우저에서 직접 접근 가능한 주소여야
  # 하므로 클러스터 내부 서비스명(nullus-keycloak)을 쓰면 안 된다.
  auth:
    mode: oidc
    oidcProvider: keycloak
    oidcAuthority: https://auth.nullus.io/realms/nullus
    # 업스트림 setup-keycloak.sh 가 만드는 클라이언트가 nullus-app 이고 차트의
    # audience 기본값도 nullus-app 이다. 프런트엔드 빌드 기본값(nullus-web)과
    # 어긋나 있어 배포에서는 nullus-app 으로 통일한다.
    oidcClientId: nullus-app

# -----------------------------------------------------------------------------
# Keycloak
#
# 브라우저가 OIDC 리다이렉트로 직접 접근해야 하므로 별도 호스트로 노출한다.
# nip.io 는 하위 라벨을 붙여도 뒤의 IP 로 해석되므로 keycloak.<IP>.nip.io 가 그대로
# 동작한다 — DNS 를 따로 두지 않아도 된다.
#
# TLS 는 ingress 가 종단하고 Let's Encrypt 실인증서를 쓴다 (setup-tls.sh).
# 로그인이 HTTPS 를 요구하기 때문이다 — PKCE 가 쓰는 crypto.subtle 은 secure
# context 에서만 노출된다.
# -----------------------------------------------------------------------------
keycloak:
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: auth.nullus.io
    # cert-manager 어노테이션을 두지 않는다. 두면 ingress-shim 이 tls 항목마다
    # Certificate 를 자동 생성하는데, 아래 시크릿은 setup-tls.sh 가 만든
    # Certificate(nullus-wildcard)가 이미 소유한다. 소유자가 둘이 되면 같은
    # 시크릿을 서로 덮어쓰며 재발급을 반복하고 Let's Encrypt 주 50건을 태운다.
    annotations: {}
    # tls:true 는 <hostname>-tls 라는 별도 시크릿을 만들어 넣는다. 와일드카드
    # 한 장으로 덮는 지금은 그게 필요 없으므로 끄고 extraTls 로 직접 지정한다.
    tls: false
    extraTls:
      - hosts:
          - auth.nullus.io
        secretName: nullus-wildcard-tls
  # KC_HOSTNAME 을 주지 않으면 Keycloak 이 요청에서 스킴을 추정해 issuer 에 https 를
  # 찍는다. 그러면 SPA 가 받은 discovery 의 issuer(https)와 실제 접속 스킴(http)이
  # 어긋나 로그인이 깨진다. 전체 URL 로 못박아 결정적으로 만든다.
  # TLS 종단은 ingress 가 하고 Keycloak 은 평문으로 받는다. 그래서 스킴을 스스로
  # 알 수 없어 KC_HOSTNAME 에 https 를 못박고 X-Forwarded-* 를 신뢰하게 한다.
  extraEnvVars:
    - name: KC_HOSTNAME
      value: https://auth.nullus.io
    - name: KC_HOSTNAME_STRICT
      value: "false"
    - name: KC_PROXY_HEADERS
      value: xforwarded
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1536Mi
  postgresql:
    primary:
      persistence:
        size: 8Gi

# -----------------------------------------------------------------------------
# Ingress
#
# Zadara 에는 LoadBalancer 연동이 없어 ingress-nginx 를 NodePort(30080/30443)로
# 설치했다. 외부 접근은 node-10 공인 IP + NodePort 로 들어온다.
#   http://<node-10-public-ip>:30080  (Host 헤더가 아래 host 와 일치해야 함)
# MetalLB 는 VPC 여유 IP 대역이 확정되지 않아 쓰지 않는다.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# 스택 게이트웨이 브리지
#
# 스택 도구는 공용 Envoy Gateway(nullus-gateway 네임스페이스)로 들어오는데,
# Zadara 에는 LoadBalancer 가 없어 그 게이트웨이가 외부 IP 를 받지 못한다.
# *.nullus.io 는 이미 node-10 공인 IP 로 DNS 가 잡혀 있으므로 요청은 도착하지만,
# ingress-nginx 에 규칙이 없어 404 가 났다. 여기서 게이트웨이로 넘긴다.
#
# TLS 는 ingress 가 와일드카드 인증서로 끊고 뒤로는 평문으로 보낸다.
# 정확한 호스트(nullus.io / auth.nullus.io)가 와일드카드보다 우선하므로
# 기존 인입은 그대로다.
# -----------------------------------------------------------------------------
gatewayBridge:
  enabled: true
  hosts:
    - "*.nullus.io"
  tlsSecretName: nullus-wildcard-tls

ingress:
  enabled: true
  className: nginx
  # cert-manager 어노테이션을 두지 않는다. 두면 ingress-shim 이 tls 항목마다
  # Certificate 를 자동 생성하는데, nullus-wildcard-tls 는 setup-tls.sh 가 만든
  # Certificate(nullus-wildcard)가 이미 소유한다. 소유자가 둘이 되면 같은 시크릿을
  # 서로 덮어쓰며 재발급을 반복하고 Let's Encrypt 주 50건을 태운다.
  # 인증서 수명주기는 helm 밖(setup-tls.sh)에 있다 —
  # docs/50_운영/Nullus_와일드카드_TLS_인증서_가이드.md 를 본다.
  annotations:
    # www 는 규칙을 따로 두지 않고 apex 로 301 보낸다. 같은 내용을 두 호스트에
    # 서비스하면 중복 콘텐츠가 되고 OIDC redirect_uri 도 호스트마다 등록해야 한다.
    # 규칙 없이 그냥 빼면 www 를 친 사람이 404 를 본다.
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
  hosts:
    # 실 도메인. Spaceship 에서 A 레코드가 node-10 공인 IP 를 가리킨다.
    - host: nullus.io
      paths:
        - path: /
          pathType: Prefix
  # HTTPS 는 선택이 아니다 — OIDC PKCE 가 crypto.subtle 을 쓰고, 브라우저는 secure
  # context 에서만 이를 노출한다. 평문 HTTP 에서는 로그인이 성립하지 않는다.
  # nullus.zadara.poc 는 공인 DNS 가 없어 ACME 검증이 불가능하므로 제외한다.
  #
  # 호스트마다 인증서를 두던 방식을 와일드카드 한 장으로 합친다. 스택이 노출하는
  # 호스트는 열둘이라(argocd/grafana/harbor/…), 호스트마다 발급하면 도구를 하나
  # 늘릴 때마다 발급이 하나 늘고 그중 하나가 실패하면 그 도구만 조용히 접속
  # 불가가 된다. 시크릿은 keycloak ingress 와 공유한다 — 같은 네임스페이스다.
  # www 는 rules 에 없지만 tls 에는 남긴다. 리다이렉트도 HTTPS 로 받아야 하고,
  # 인증서가 없으면 브라우저가 301 을 보기 전에 경고부터 띄운다.
  tls:
    - secretName: nullus-wildcard-tls
      hosts:
        - nullus.io
        - www.nullus.io

# -----------------------------------------------------------------------------
# PostgreSQL
#
# StorageClass 는 local-path-provisioner(rancher.io/local-path, default)를 쓴다.
# WaitForFirstConsumer 라 PVC 는 파드가 스케줄된 노드의 로컬 디스크에 바인딩된다.
# 노드를 재생성하면 데이터가 사라지므로 PoC 한정이다 — 프로덕션 전환 시
# Zadara 볼륨 CSI 로 교체할 것 (zadara_cloud_poc.md §11).
# -----------------------------------------------------------------------------
postgresql:
  enabled: true
  primary:
    persistence:
      enabled: true
      size: 20Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi

config:
  server:
    mode: production
  # API 의 JWT 검증. issuer 는 Keycloak 이 토큰에 찍는 값과 **문자열이 같아야** 하고,
  # 그 값은 브라우저가 쓰는 공개 주소다. audience 는 setup-keycloak 이 붙이는
  # audience 매퍼 값과 맞춘다.
  auth:
    mode: oidc
    oidcIssuerUrl: https://auth.nullus.io/realms/nullus
    oidcAudience: nullus-app
  log:
    level: info
    format: json

# ghcr 패키지는 2026-08-07 에 public 으로 전환되어 익명 pull 이 된다 — 비워 둔다.
# 다시 private 이 되면 pull secret 을 만들고 [{name: ghcr-pull-secret}] 로 바꾼다.
#   kubectl -n nullus create secret docker-registry ghcr-pull-secret \
#     --docker-server=ghcr.io --docker-username="$GHCR_USER" --docker-password="$GHCR_PAT"
imagePullSecrets: []
