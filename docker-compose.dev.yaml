services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: nullus
      POSTGRES_USER: nullus
      POSTGRES_PASSWORD: nullus_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nullus -d nullus"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nullus
      MINIO_ROOT_PASSWORD: nullus_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      # dev-mem(H2 인메모리)은 마지막 커넥션이 닫히면 DB 가 통째로 사라진다.
      # 기동 15분쯤 뒤 "Table \"REALM\" not found (this database is empty)" 가
      # 뜨면서 realm/유저가 전부 날아가고 토큰 엔드포인트가 500 을 반환했다.
      # dev-file 은 같은 개발용 H2 이지만 파일로 유지되어 세션 중 증발하지 않는다.
      KC_DB: dev-file
      # KC 26 에서 KEYCLOAK_ADMIN/KEYCLOAK_ADMIN_PASSWORD 는 deprecated 다.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - keycloak_data:/opt/keycloak/data
    ports:
      - "8180:8080"

volumes:
  postgres_data:
  minio_data:
  redis_data:
  keycloak_data:
