server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://nullus-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass http://nullus-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri /index.html;
    }

    # 런타임 설정은 컨테이너 기동 시 생성되므로 캐시하면 안 된다.
    # 캐시된 예전 config.js 를 물면 OIDC issuer 가 옛 값으로 남는다.
    location = /config.js {
        # 도큐먼트 루트가 읽기 전용이라 기동 시 생성물은 별도 볼륨에 둔다.
        alias /var/lib/nullus/config.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        default_type application/javascript;
    }

    # 빌드 산출물은 내용 해시가 파일명에 들어가므로 오래 캐시해도 안전하다.
    # 중요한 건 **없으면 404 를 줘야 한다**는 것이다. SPA 폴백에 맡기면 없는 청크
    # 요청에 index.html 이 200 으로 나가고, 브라우저는 그걸 모듈로 파싱하려다
    #   Failed to fetch dynamically imported module
    # 로 죽는다. 배포로 청크 해시가 바뀐 뒤 열려 있던 탭에서 반드시 재현된다.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
